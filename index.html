    <h1>全球 AI / 科技会议雷达日历</h1>
    <p>这是只读公开日历，只包含公开的会议日期、地点和官方网站。</p>
    <p><a href="conferences.ics">查看或下载 conferences.ics</a></p>
    <h2>Google Calendar 订阅</h2>
    <ol>
      <li>复制浏览器地址栏中的本页面地址，并将末尾的 <code>/</code> 改为 <code>/conferences.ics</code>。</li>
      <li>在电脑上打开 Google Calendar。</li>
      <li>在“其他日历”旁点击“+”，选择“通过网址”。</li>
      <li>粘贴 ICS 地址并添加日历。请勿使用一次性文件导入。</li>
    </ol>
  </main>
